<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>臺北市立明德國民中學 3D 校園探索</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
        #webgl-canvas { width: 100%; height: 100%; display: block; }

        /* 準心 */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 5;
        }

        /* 抬頭顯示 (HUD) */
        #hud {
            position: absolute; top: 25px; left: 25px;
            color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 5;
        }
        .school-name { font-size: 26px; font-weight: 800; color: #facc15; letter-spacing: 2px; }
        .badge-counter {
            font-size: 16px; margin-top: 8px; background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(6px); padding: 8px 18px; border-radius: 20px;
            border-left: 4px solid #38bdf8; width: fit-content;
        }

        /* 小地圖 (Minimap) */
        #minimap-wrapper {
            position: absolute; top: 25px; right: 25px;
            width: 150px; height: 150px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8; border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            overflow: hidden; pointer-events: none; z-index: 5;
        }
        #minimap { width: 100%; height: 100%; }

        /* 功能快捷鍵與全螢幕按鈕 */
        #fullscreen-btn {
            position: absolute; bottom: 25px; right: 25px;
            background: rgba(15, 23, 42, 0.8); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); padding: 10px 18px;
            border-radius: 8px; font-size: 14px; cursor: pointer; z-index: 5;
            backdrop-filter: blur(4px); transition: all 0.2s ease;
        }
        #fullscreen-btn:hover { background: #38bdf8; color: #000; }

        /* 啟動選單 / 遮罩 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 20; color: #fff;
        }
        #menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255,255,255,0.15);
            padding: 40px; border-radius: 20px; max-width: 520px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        #menu-card h1 { font-size: 32px; color: #facc15; margin-bottom: 15px; }
        #menu-card p { font-size: 15px; color: #cbd5e1; line-height: 1.8; margin-bottom: 8px; }
        .tag { background: #475569; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        #start-game-btn {
            margin-top: 25px; padding: 14px 45px; font-size: 18px; font-weight: bold;
            color: #0f172a; background: #22c55e; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
            transition: all 0.2s ease;
        }
        #start-game-btn:hover { background: #16a34a; color: #fff; transform: translateY(-2px); }

        /* 通關結算畫面 */
        #victory-card {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95);
            padding: 35px 50px; border-radius: 20px; border: 2px solid #facc15;
            text-align: center; z-index: 50; color: #fff;
            box-shadow: 0 0 50px rgba(250, 204, 21, 0.5);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="school-name">臺北市立明德國民中學 3D</div>
        <div class="badge-counter">校徽寶石收集進度：<span id="collected-text">0</span> / 5</div>
    </div>

    <div id="minimap-wrapper">
        <canvas id="minimap" width="150" height="150"></canvas>
    </div>

    <button id="fullscreen-btn">切換全螢幕 ⛶</button>

    <!-- 開始遊戲視窗 -->
    <div id="overlay">
        <div id="menu-card">
            <h1>🏫 明德國中 校園冒險</h1>
            <p>GitHub Pages 原生架構已就緒，支援真・第一人稱滑鼠視角！</p>
            <p><span class="tag">W</span> <span class="tag">A</span> <span class="tag">S</span> <span class="tag">D</span>：走動控制</p>
            <p><span class="tag">滑鼠滑動</span>：360° 自由環顧校園</p>
            <p><span class="tag">Space</span>：跳躍 ｜ <span class="tag">Shift</span>：跑步衝刺</p>
            <p style="margin-top: 15px; color: #38bdf8;">🎯 任務：探索明德路校門、榕園合院、PU操場、籃球場與體育館，收集 5 枚金色明德校徽！</p>
            <button id="start-game-btn">點擊進入校園</button>
        </div>
    </div>

    <!-- 勝利視窗 -->
    <div id="victory-card">
        <h2 style="color: #facc15; font-size: 28px; margin-bottom: 10px;">🎉 恭喜！探索成功！</h2>
        <p>你已成功收集齊全臺北市立明德國中的所有榮譽校徽！</p>
        <button onclick="location.reload()" style="margin-top: 18px; padding: 10px 24px; border: none; border-radius: 20px; background: #22c55e; color: #fff; font-weight: bold; cursor: pointer;">再次遊玩</button>
    </div>

    <div id="webgl-canvas"></div>

    <script>
        let scene, camera, renderer;
        let isPlaying = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isSprinting = false, canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        const pitchObject = new THREE.Object3D();
        const yawObject = new THREE.Object3D();
        const colliders = [];
        const badges = [];
        let collectedCount = 0;

        // 原生音效
        let audioCtx = null;
        function playChime() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.22);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } catch(e) {}
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            initScene();
            setupControls();
            animate();
        });

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec8e3);
            scene.fog = new THREE.FogExp2(0x7ec8e3, 0.007);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            pitchObject.add(camera);
            yawObject.position.set(0, 1.7, 65); // 明德路校門口
            yawObject.add(pitchObject);
            scene.add(yawObject);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xfffaed, 0.85);
            sun.position.set(60, 100, 40);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            buildEnvironment();
            buildMingdeBuildings();
            spawnBadges();

            window.addEventListener('resize', onWindowResize);
        }

        function createSignTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e40af'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 14; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 85px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('臺北市立明德國民中學', canvas.width / 2, canvas.height / 2);
            return new THREE.CanvasTexture(canvas);
        }

        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f1f5f9'; ctx.fillRect(0, 0, 512, 512);
            for (let y = 35; y < 512; y += 120) {
                for (let x = 30; x < 512; x += 115) {
                    ctx.fillStyle = '#334155'; ctx.fillRect(x, y, 75, 65);
                    ctx.fillStyle = '#60a5fa'; ctx.fillRect(x + 4, y + 4, 32, 57); ctx.fillRect(x + 39, y + 4, 32, 57);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function buildEnvironment() {
            // 草坪地表
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshLambertMaterial({ color: 0x4ade80 }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 北投／陽明山系
            const mMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
            for (let i = -2; i <= 2; i++) {
                const m = new THREE.Mesh(new THREE.ConeGeometry(75, 65, 6), mMat);
                m.position.set(i * 68, 22, -140);
                scene.add(m);
            }

            // 四周圍牆
            createWall(-85, 0, 2, 170); createWall(85, 0, 2, 170);
            createWall(0, -85, 170, 2); createWall(-48, 75, 75, 2); createWall(48, 75, 75, 2);
        }

        function createWall(x, z, w, d) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 3, d), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
            mesh.position.set(x, 1.5, z);
            scene.add(mesh);
            colliders.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
        }

        function buildMingdeBuildings() {
            const wallTexture = createWallTexture();
            wallTexture.repeat.set(3, 2);
            const buildingMat = new THREE.MeshLambertMaterial({ map: wallTexture });

            // 1. 明德路主校門
            const colMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
            const col1 = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), colMat); col1.position.set(-8, 3, 75);
            const col2 = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 2), colMat); col2.position.set(8, 3, 75);
            scene.add(col1); scene.add(col2);

            const beam = new THREE.Mesh(new THREE.BoxGeometry(18, 2, 2.5), colMat);
            beam.position.set(0, 6, 75); scene.add(beam);

            const sign = new THREE.Mesh(new THREE.PlaneGeometry(12, 2), new THREE.MeshBasicMaterial({ map: createSignTexture() }));
            sign.position.set(0, 6, 76.3); scene.add(sign);

            // 警衛傳達室
            const guard = new THREE.Mesh(new THREE.BoxGeometry(5, 3.5, 4), new THREE.MeshLambertMaterial({ color: 0xe2e8f0 }));
            guard.position.set(13, 1.75, 73); scene.add(guard);
            colliders.push({ minX: 10.5, maxX: 15.5, minZ: 71, maxZ: 75 });

            // 2. 教學大樓合院群 (修澤蘭建築風格佈局)
            addBuilding(0, 40, 52, 14, 12, buildingMat);
            addBuilding(-30, 15, 12, 14, 45, buildingMat);
            addBuilding(30, 15, 12, 14, 45, buildingMat);

            // 3. 內苑／榕園中庭綠地
            const garden = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 0.4, 16), new THREE.MeshLambertMaterial({ color: 0x22c55e }));
            garden.position.set(0, 0.2, 15); scene.add(garden);
            addTree(0, 15, 2.3); addTree(-6, 12, 1.8); addTree(6, 17, 1.8);

            // 4. 學生活動中心（體育館）
            addBuilding(-50, -35, 30, 16, 40, new THREE.MeshLambertMaterial({ color: 0xf87171 }));
            const roof = new THREE.Mesh(new THREE.CylinderGeometry(16, 16, 40, 8, 1, false, 0, Math.PI), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
            roof.position.set(-50, 16, -35); roof.rotation.x = Math.PI / 2;
            scene.add(roof);

            // 5. 200m PU 操場
            const track = new THREE.Mesh(new THREE.PlaneGeometry(55, 65), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
            track.rotation.x = -Math.PI / 2; track.position.set(45, 0.05, -35); scene.add(track);

            const innerGrass = new THREE.Mesh(new THREE.PlaneGeometry(35, 45), new THREE.MeshLambertMaterial({ color: 0x22c55e }));
            innerGrass.rotation.x = -Math.PI / 2; innerGrass.position.set(45, 0.08, -35); scene.add(innerGrass);

            // 6. 戶外雙座籃球場
            const court = new THREE.Mesh(new THREE.PlaneGeometry(28, 38), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
            court.rotation.x = -Math.PI / 2; court.position.set(-10, 0.06, -50); scene.add(court);
            addHoop(-10, -66); addHoop(-10, -34);
        }

        function addBuilding(x, z, w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, h/2, z);
            mesh.castShadow = true; mesh.receiveShadow = true;
            scene.add(mesh);
            colliders.push({ minX: x - w/2 - 0.4, maxX: x + w/2 + 0.4, minZ: z - d/2 - 0.4, maxZ: z + d/2 + 0.4 });
        }

        function addTree(x, z, scale = 1) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3 * scale, 0.5 * scale, 3 * scale), new THREE.MeshLambertMaterial({ color: 0x78350f }));
            trunk.position.set(x, 1.5 * scale, z); scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2 * scale), new THREE.MeshLambertMaterial({ color: 0x15803d }));
            leaves.position.set(x, 3.8 * scale, z); scene.add(leaves);
        }

        function addHoop(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4), new THREE.MeshLambertMaterial({ color: 0xffffff }));
            pole.position.set(x, 2, z); scene.add(pole);
            const board = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 0.1), new THREE.MeshLambertMaterial({ color: 0xffffff }));
            board.position.set(x, 3.5, z); scene.add(board);
        }

        function spawnBadges() {
            const spots = [{ x: 0, z: 62 }, { x: 0, z: 15 }, { x: 45, z: -35 }, { x: -10, z: -50 }, { x: -50, z: -12 }];
            const starGeo = new THREE.OctahedronGeometry(0.8, 0);
            const starMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xd97706, roughness: 0.2, metalness: 0.8 });

            spots.forEach(pos => {
                const mesh = new THREE.Mesh(starGeo, starMat);
                mesh.position.set(pos.x, 1.5, pos.z);
                scene.add(mesh);
                badges.push({ mesh, collected: false, x: pos.x, z: pos.z });
            });
        }

        /* ================= 滑鼠指標鎖定控制 ================= */
        function setupControls() {
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('start-game-btn');
            const fsBtn = document.getElementById('fullscreen-btn');

            startBtn.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isPlaying = true;
                    overlay.style.display = 'none';
                    playChime();
                } else {
                    isPlaying = false;
                    overlay.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPlaying) return;
                yawObject.rotation.y -= e.movementX * 0.0022;
                pitchObject.rotation.x -= e.movementY * 0.0022;
                pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
            });

            // 鍵盤移動
            document.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                switch(e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump) velocity.y += 11; canJump = false; break;
                    case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
                }
            });

            // 全螢幕切換按鈕
            fsBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });
        }

        function checkCollision(nextX, nextZ) {
            for (let b of colliders) {
                if (nextX > b.minX && nextX < b.maxX && nextZ > b.minZ && nextZ < b.maxZ) return true;
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 小地圖雷達
        const miniCanvas = document.getElementById('minimap');
        const mCtx = miniCanvas.getContext('2d');
        function drawMinimap() {
            mCtx.clearRect(0, 0, 150, 150);
            const scale = 0.8; const cx = 75, cy = 75;
            mCtx.fillStyle = '#0f172a'; mCtx.fillRect(0, 0, 150, 150);

            // 建築
            mCtx.fillStyle = '#64748b';
            colliders.forEach(b => {
                const bx = cx + (b.minX + (b.maxX - b.minX)/2) * scale;
                const bz = cy + (b.minZ + (b.maxZ - b.minZ)/2) * scale;
                mCtx.fillRect(bx - (b.maxX - b.minX)*scale/2, bz - (b.maxZ - b.minZ)*scale/2, (b.maxX - b.minX)*scale, (b.maxZ - b.minZ)*scale);
            });

            // 寶石
            badges.forEach(b => {
                if (!b.collected) {
                    mCtx.fillStyle = '#facc15';
                    mCtx.beginPath(); mCtx.arc(cx + b.x * scale, cy + b.z * scale, 3.5, 0, Math.PI * 2); mCtx.fill();
                }
            });

            // 玩家座標與視角指標
            const px = cx + yawObject.position.x * scale;
            const pz = cy + yawObject.position.z * scale;
            mCtx.fillStyle = '#38bdf8';
            mCtx.beginPath(); mCtx.arc(px, pz, 4, 0, Math.PI * 2); mCtx.fill();

            const angle = yawObject.rotation.y;
            mCtx.strokeStyle = '#ef4444'; mCtx.lineWidth = 2;
            mCtx.beginPath(); mCtx.moveTo(px, pz);
            mCtx.lineTo(px - Math.sin(angle) * 10, pz - Math.cos(angle) * 10);
            mCtx.stroke();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (isPlaying) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta;

                const speed = isSprinting ? 55.0 : 30.0;
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
                const step = forward.clone().multiplyScalar(-velocity.z * delta).add(side.clone().multiplyScalar(velocity.x * delta));

                const cur = yawObject.position.clone();
                if (!checkCollision(cur.x + step.x, cur.z)) yawObject.position.x += step.x;
                if (!checkCollision(cur.x, cur.z + step.z)) yawObject.position.z += step.z;

                yawObject.position.y += velocity.y * delta;
                if (yawObject.position.y < 1.7) {
                    velocity.y = 0; yawObject.position.y = 1.7; canJump = true;
                }

                // 寶石自轉與拾取
                badges.forEach((b) => {
                    if (!b.collected) {
                        b.mesh.rotation.y += 2 * delta;
                        b.mesh.rotation.x += 1 * delta;
                        if (yawObject.position.distanceTo(b.mesh.position) < 2.2) {
                            b.collected = true;
                            scene.remove(b.mesh);
                            collectedCount++;
                            document.getElementById('collected-text').innerText = collectedCount;
                            playChime();
                            if (collectedCount === badges.length) {
                                document.getElementById('victory-card').style.display = 'block';
                                document.exitPointerLock();
                            }
                        }
                    }
                });

                drawMinimap();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
