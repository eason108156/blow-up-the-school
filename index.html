<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>臺北市立明德國民中學 - 實景還原 3D 校園</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0b132b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
        #webgl-canvas { width: 100%; height: 100%; display: block; }

        /* 準心 */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 5;
        }

        /* 抬頭顯示 (HUD) */
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
            pointer-events: none; z-index: 5;
        }
        .school-name { font-size: 24px; font-weight: 800; color: #facc15; letter-spacing: 1.5px; }
        .school-desc { font-size: 13px; color: #94a3b8; margin-top: 2px; }
        .badge-counter {
            font-size: 15px; margin-top: 8px; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 20px;
            border-left: 4px solid #38bdf8; width: fit-content;
        }

        /* 衛星雷達小地圖 (Minimap) */
        #minimap-wrapper {
            position: absolute; top: 20px; right: 20px;
            width: 160px; height: 160px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            overflow: hidden; pointer-events: none; z-index: 5;
        }
        #minimap { width: 100%; height: 100%; }

        #fullscreen-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.85); color: #fff;
            border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px;
            border-radius: 8px; font-size: 13px; cursor: pointer; z-index: 5;
            backdrop-filter: blur(4px);
        }
        #fullscreen-btn:hover { background: #38bdf8; color: #000; }

        /* 啟動選單 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 19, 43, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 20; color: #fff;
        }
        #menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255,255,255,0.15);
            padding: 35px 45px; border-radius: 20px; max-width: 520px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        #menu-card h1 { font-size: 28px; color: #facc15; margin-bottom: 12px; }
        #menu-card p { font-size: 14px; color: #cbd5e1; line-height: 1.8; margin-bottom: 8px; }
        .tag { background: #475569; color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: bold; }
        
        #start-btn {
            margin-top: 20px; padding: 12px 40px; font-size: 17px; font-weight: bold;
            color: #0f172a; background: #22c55e; border: none; border-radius: 30px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }
        #start-btn:hover { background: #16a34a; color: #fff; }

        #victory-card {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95);
            padding: 35px 50px; border-radius: 20px; border: 2px solid #facc15;
            text-align: center; z-index: 50; color: #fff;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>

    <div id="hud">
        <div class="school-name">臺北市立明德國民中學</div>
        <div class="school-desc">北投區明德路50號 ｜ 依真實 Google 衛星幾何配置還原</div>
        <div class="badge-counter">校徽寶石收集進度：<span id="collected-text">0</span> / 5</div>
    </div>

    <div id="minimap-wrapper">
        <canvas id="minimap" width="160" height="160"></canvas>
    </div>

    <button id="fullscreen-btn">切換全螢幕 ⛶</button>

    <div id="overlay">
        <div id="menu-card">
            <h1>🏫 明德國中 實景模擬</h1>
            <p>已根據 Google Earth 衛星航測重塑校舍結構與操場尺度！</p>
            <p><span class="tag">W</span> <span class="tag">A</span> <span class="tag">S</span> <span class="tag">D</span>：走動控制</p>
            <p><span class="tag">滑鼠滑動</span>：360° 自由環顧校園</p>
            <p><span class="tag">Space</span>：跳躍 ｜ <span class="tag">Shift</span>：跑步衝刺</p>
            <p style="margin-top: 15px; color: #38bdf8;">🎯 地標巡禮：明德路校門、行政樓穿堂、四維樓合院、活動中心、PU操場司令台</p>
            <button id="start-btn">進入 3D 校園</button>
        </div>
    </div>

    <div id="victory-card">
        <h2 style="color: #facc15; font-size: 26px; margin-bottom: 10px;">🎉 探索完成！</h2>
        <p>你已走遍明德國中主要地標並收集所有榮譽校徽！</p>
        <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 24px; border: none; border-radius: 20px; background: #22c55e; color: #fff; font-weight: bold; cursor: pointer;">再次遊玩</button>
    </div>

    <div id="webgl-canvas"></div>

    <script>
        let scene, camera, renderer;
        let isPlaying = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isSprinting = false, canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        const pitchObject = new THREE.Object3D();
        const yawObject = new THREE.Object3D();
        const colliders = [];
        const badges = [];
        let collectedCount = 0;

        // 音效引擎
        let audioCtx = null;
        function playChime() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.22);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScene();
            setupControls();
            animate();
        });

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // 台北晴空
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.006);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            pitchObject.add(camera);
            // 玩家出生點：明德路大門口外側人行道
            yawObject.position.set(0, 1.7, 78);
            yawObject.add(pitchObject);
            scene.add(yawObject);

            // 環境光與定向日光
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(hemiLight);

            const sun = new THREE.DirectionalLight(0xfffaed, 0.9);
            sun.position.set(70, 120, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.camera.near = 0.5;
            sun.shadow.camera.far = 400;
            sun.shadow.camera.left = -100;
            sun.shadow.camera.right = 100;
            sun.shadow.camera.top = 100;
            sun.shadow.camera.bottom = -100;
            scene.add(sun);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            buildSatelliteEnvironment();
            buildMingdeRealisticCampus();
            spawnBadges();

            window.addEventListener('resize', onWindowResize);
        }

        /* ================= 衛星圖層與材質紋理 ================= */
        // 跑道線紋理
        function createTrackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#b91c1c'; // PU 紅色跑道
            ctx.fillRect(0, 0, 1024, 1024);

            // 白色跑道分道線
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            for (let i = 0; i < 6; i++) {
                const inset = 30 + i * 22;
                ctx.beginPath();
                ctx.roundRect(inset, inset, 1024 - inset * 2, 1024 - inset * 2, 280);
                ctx.stroke();
            }

            // 內圈足球草坪
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.roundRect(180, 180, 1024 - 360, 1024 - 360, 200);
            ctx.fill();

            // 足球場白線與中圈
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(220, 260, 584, 504);
            ctx.beginPath();
            ctx.arc(512, 512, 60, 0, Math.PI * 2);
            ctx.moveTo(220, 512); ctx.lineTo(804, 512);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        // 教學大樓修澤蘭風格立面紋理（水平窗帶與遮陽線條）
        function createModernSchoolWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e2e8f0'; // 洗石子灰白基調
            ctx.fillRect(0, 0, 512, 512);

            // 水平遮陽板與窗帶
            for (let y = 20; y < 512; y += 128) {
                ctx.fillStyle = '#0f172a'; // 窗框深色
                ctx.fillRect(20, y + 25, 472, 65);
                ctx.fillStyle = '#38bdf8'; // 藍色玻璃
                for (let x = 25; x < 490; x += 55) {
                    ctx.fillRect(x, y + 30, 48, 55);
                }
                // 水平突出遮陽水泥樑
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(10, y + 15, 492, 12);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // 活動中心外牆（淺紅抿石子 + 彩色線條）
        function createGymWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e57373'; // 標誌性粉紅石子色
            ctx.fillRect(0, 0, 512, 512);
            // 彩色馬賽克跳色橫紋
            const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ec4899'];
            colors.forEach((c, idx) => {
                ctx.fillStyle = c;
                ctx.fillRect(0, 320 + idx * 25, 512, 12);
            });
            return new THREE.CanvasTexture(canvas);
        }

        function createSignboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, 1024, 256);
            ctx.lineWidth = 14; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(7, 7, 1010, 242);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 80px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('臺北市立明德國民中學', 512, 128);
            return new THREE.CanvasTexture(canvas);
        }

        /* ================= 依照衛星幾何建立真實校園 ================= */
        function buildSatelliteEnvironment() {
            // 校園總基地 (約 200m x 200m)
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({ color: 0x86efac }));
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 南側：明德路柏油道路與斑馬線 (Z: 75 ~ 115)
            const road = new THREE.Mesh(new THREE.PlaneGeometry(240, 30), new THREE.MeshLambertMaterial({ color: 0x334155 }));
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0.05, 90);
            road.receiveShadow = true;
            scene.add(road);

            // 明德路黃色雙黃線
            const roadLine = new THREE.Mesh(new THREE.PlaneGeometry(240, 0.6), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
            roadLine.rotation.x = -Math.PI / 2;
            roadLine.position.set(0, 0.08, 90);
            scene.add(roadLine);

            // 人行道紅磚道
            const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(240, 5), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
            sidewalk.rotation.x = -Math.PI / 2;
            sidewalk.position.set(0, 0.1, 74);
            scene.add(sidewalk);

            // 北側陽明山/大屯山遠山地貌
            const mountainMat = new THREE.MeshLambertMaterial({ color: 0x166534 });
            for (let i = -3; i <= 3; i++) {
                const m = new THREE.Mesh(new THREE.ConeGeometry(85, 75, 7), mountainMat);
                m.position.set(i * 55, 25, -150);
                scene.add(m);
            }

            // 邊界校牆圍籬
            createPerimeterWall(-75, 0, 2, 150); // 西邊牆 (致遠二路側)
            createPerimeterWall(75, 0, 2, 150);  // 東邊牆 (明德路巷弄)
            createPerimeterWall(0, -75, 150, 2); // 北後牆
            createPerimeterWall(-42, 72, 64, 2); // 南大門左側牆
            createPerimeterWall(42, 72, 64, 2);  // 南大門右側牆
        }

        function createPerimeterWall(x, z, w, d) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 3.2, d), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
            mesh.position.set(x, 1.6, z);
            scene.add(mesh);
            colliders.push({ minX: x - w/2, maxX: x + w/2, minZ: z - d/2, maxZ: z + d/2 });
        }

        function buildMingdeRealisticCampus() {
            const wallTexture = createModernSchoolWallTexture();
            wallTexture.repeat.set(4, 2);
            const mainBuildingMat = new THREE.MeshLambertMaterial({ map: wallTexture });
            const roofMat = new THREE.MeshLambertMaterial({ color: 0x64748b });

            // 1. 南面主校門 (明德路50號正門)
            const gateColMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
            const colL = new THREE.Mesh(new THREE.BoxGeometry(2, 6.5, 2), gateColMat); colL.position.set(-8, 3.25, 72);
            const colR = new THREE.Mesh(new THREE.BoxGeometry(2, 6.5, 2), gateColMat); colR.position.set(8, 3.25, 72);
            scene.add(colL); scene.add(colR);

            const gateBeam = new THREE.Mesh(new THREE.BoxGeometry(18, 2, 2.5), gateColMat);
            gateBeam.position.set(0, 6.5, 72); scene.add(gateBeam);

            const sign = new THREE.Mesh(new THREE.PlaneGeometry(12, 2), new THREE.MeshBasicMaterial({ map: createSignboardTexture() }));
            sign.position.set(0, 6.5, 73.3); scene.add(sign);

            // 警衛傳達室
            addDetailedBuilding(13, 1.8, 69, 5, 3.6, 4, new THREE.MeshLambertMaterial({ color: 0xf8fafc }));

            // 2. 行政大樓前棟（橫貫中央穿堂）
            addDetailedBuilding(0, 7.5, 52, 60, 15, 12, mainBuildingMat, true);

            // 3. 修澤蘭設計：四維樓與知行樓合院群 (日字型/雙口中庭)
            // 西翼教學樓
            addDetailedBuilding(-26, 7.5, 22, 10, 15, 48, mainBuildingMat, true);
            // 東翼教學樓
            addDetailedBuilding(26, 7.5, 22, 10, 15, 48, mainBuildingMat, true);
            // 中後棟教室 (北側橫棟)
            addDetailedBuilding(0, 7.5, -3, 62, 15, 10, mainBuildingMat, true);

            // 4. 內苑／榕園核心景觀庭園 (位於前棟與中棟之間的內院)
            const gardenCourt = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 0.4, 16), new THREE.MeshLambertMaterial({ color: 0x15803d }));
            gardenCourt.position.set(0, 0.2, 25); scene.add(gardenCourt);
            addBanyanTree(0, 25, 2.6);
            addBanyanTree(-7, 21, 1.9);
            addBanyanTree(7, 28, 1.9);

            // 5. 西北側：學生活動中心 (體育館，興建於民國72年/近期拉皮翻新)
            const gymMat = new THREE.MeshLambertMaterial({ map: createGymWallTexture() });
            addDetailedBuilding(-48, 8, -35, 28, 16, 44, gymMat, false);
            // 弧形挑高拱頂
            const archRoof = new THREE.Mesh(
                new THREE.CylinderGeometry(15, 15, 44, 16, 1, false, 0, Math.PI),
                new THREE.MeshLambertMaterial({ color: 0x0284c7 })
            );
            archRoof.position.set(-48, 16, -35);
            archRoof.rotation.x = Math.PI / 2;
            scene.add(archRoof);

            // 6. 東側：200公尺標準 PU 操場 (衛星視圖上最顯眼的地標)
            const trackGeo = new THREE.PlaneGeometry(54, 75);
            const trackMesh = new THREE.Mesh(trackGeo, new THREE.MeshLambertMaterial({ map: createTrackTexture() }));
            trackMesh.rotation.x = -Math.PI / 2;
            trackMesh.position.set(45, 0.12, -22);
            trackMesh.receiveShadow = true;
            scene.add(trackMesh);

            // 操場司令台看台 (位於操場西側，面向操場)
            addDetailedBuilding(16, 2.5, -22, 4, 5, 16, new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
            const standRoof = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 18), new THREE.MeshLambertMaterial({ color: 0x0284c7 }));
            standRoof.position.set(16, 5.2, -22); scene.add(standRoof);

            // 7. 戶外雙座壓克力籃球場 (位於活動中心與操場之間)
            const bbCourt = new THREE.Mesh(new THREE.PlaneGeometry(28, 38), new THREE.MeshLambertMaterial({ color: 0x0369a1 }));
            bbCourt.rotation.x = -Math.PI / 2;
            bbCourt.position.set(-14, 0.1, -48);
            scene.add(bbCourt);
            createHoop(-14, -65); createHoop(-14, -31);
        }

        // 建立帶女兒牆與屋頂設備的真實校舍
        function addDetailedBuilding(x, y, z, w, h, d, mat, addRoofDetails = false) {
            const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            building.position.set(x, y, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            colliders.push({ minX: x - w/2 - 0.4, maxX: x + w/2 + 0.4, minZ: z - d/2 - 0.4, maxZ: z + d/2 + 0.4 });

            // 屋頂構造（模擬衛星圖上清晰可見的女兒牆、電梯機房與水塔）
            if (addRoofDetails) {
                // 女兒牆
                const parapetMat = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
                const parapet = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, d), parapetMat);
                parapet.position.set(x, y + h/2 + 0.4, z);
                scene.add(parapet);

                // 電梯機房機樓
                const elevatorBox = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), parapetMat);
                elevatorBox.position.set(x - w/4, y + h/2 + 1.5, z);
                scene.add(elevatorBox);

                // 不鏽鋼圓柱水塔
                const tankMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.8, roughness: 0.2 });
                const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 2.5, 12), tankMat);
                tank.position.set(x + w/4, y + h/2 + 1.25, z);
                scene.add(tank);
            }
        }

        function addBanyanTree(x, z, scale = 1) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.7 * scale, 3 * scale), new THREE.MeshLambertMaterial({ color: 0x5a3825 }));
            trunk.position.set(x, 1.5 * scale, z); scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.4 * scale, 8, 8), new THREE.MeshLambertMaterial({ color: 0x166534 }));
            leaves.position.set(x, 3.8 * scale, z); scene.add(leaves);
        }

        function createHoop(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4), new THREE.MeshLambertMaterial({ color: 0xffffff }));
            pole.position.set(x, 2, z); scene.add(pole);
            const board = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 0.1), new THREE.MeshLambertMaterial({ color: 0xffffff }));
            board.position.set(x, 3.5, z); scene.add(board);
        }

        function spawnBadges() {
            // 五大標誌性收集點
            const spots = [
                { x: 0, z: 62, title: "明德路正門" },
                { x: 0, z: 25, title: "中庭榕園" },
                { x: 45, z: -22, title: "200M操場" },
                { x: 16, z: -22, title: "操場司令台" },
                { x: -48, z: -15, title: "學生活動中心" }
            ];
            const starGeo = new THREE.OctahedronGeometry(0.8, 0);
            const starMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xd97706, roughness: 0.2, metalness: 0.8 });

            spots.forEach(pos => {
                const mesh = new THREE.Mesh(starGeo, starMat);
                mesh.position.set(pos.x, 1.5, pos.z);
                scene.add(mesh);
                badges.push({ mesh, collected: false, x: pos.x, z: pos.z });
            });
        }

        /* ================= 視角與控制器 ================= */
        function setupControls() {
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('start-btn');
            const fsBtn = document.getElementById('fullscreen-btn');

            startBtn.addEventListener('click', () => { document.body.requestPointerLock(); });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isPlaying = true;
                    overlay.style.display = 'none';
                    playChime();
                } else {
                    isPlaying = false;
                    overlay.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPlaying) return;
                yawObject.rotation.y -= e.movementX * 0.0022;
                pitchObject.rotation.x -= e.movementY * 0.0022;
                pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
            });

            document.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                switch(e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump) velocity.y += 11; canJump = false; break;
                    case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
                }
            });

            fsBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            });
        }

        function checkCollision(nextX, nextZ) {
            for (let b of colliders) {
                if (nextX > b.minX && nextX < b.maxX && nextZ > b.minZ && nextZ < b.maxZ) return true;
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 衛星小地圖
        const miniCanvas = document.getElementById('minimap');
        const mCtx = miniCanvas.getContext('2d');
        function drawMinimap() {
            mCtx.clearRect(0, 0, 160, 160);
            const scale = 0.85; const cx = 80, cy = 80;
            mCtx.fillStyle = '#0f172a'; mCtx.fillRect(0, 0, 160, 160);

            // 操場跑道圖形
            mCtx.fillStyle = '#b91c1c';
            mCtx.beginPath();
            mCtx.roundRect(cx + (45-25)*scale, cy + (-22-35)*scale, 50*scale, 70*scale, 18);
            mCtx.fill();

            // 建築投影
            mCtx.fillStyle = '#64748b';
            colliders.forEach(b => {
                const bx = cx + (b.minX + (b.maxX - b.minX)/2) * scale;
                const bz = cy + (b.minZ + (b.maxZ - b.minZ)/2) * scale;
                mCtx.fillRect(bx - (b.maxX - b.minX)*scale/2, bz - (b.maxZ - b.minZ)*scale/2, (b.maxX - b.minX)*scale, (b.maxZ - b.minZ)*scale);
            });

            // 寶石
            badges.forEach(b => {
                if (!b.collected) {
                    mCtx.fillStyle = '#facc15';
                    mCtx.beginPath(); mCtx.arc(cx + b.x * scale, cy + b.z * scale, 3.5, 0, Math.PI * 2); mCtx.fill();
                }
            });

            // 玩家
            const px = cx + yawObject.position.x * scale;
            const pz = cy + yawObject.position.z * scale;
            mCtx.fillStyle = '#38bdf8';
            mCtx.beginPath(); mCtx.arc(px, pz, 4, 0, Math.PI * 2); mCtx.fill();

            const angle = yawObject.rotation.y;
            mCtx.strokeStyle = '#ef4444'; mCtx.lineWidth = 2;
            mCtx.beginPath(); mCtx.moveTo(px, pz);
            mCtx.lineTo(px - Math.sin(angle) * 10, pz - Math.cos(angle) * 10);
            mCtx.stroke();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (isPlaying) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta;

                const speed = isSprinting ? 55.0 : 30.0;
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yawObject.rotation.y);
                const step = forward.clone().multiplyScalar(-velocity.z * delta).add(side.clone().multiplyScalar(velocity.x * delta));

                const cur = yawObject.position.clone();
                if (!checkCollision(cur.x + step.x, cur.z)) yawObject.position.x += step.x;
                if (!checkCollision(cur.x, cur.z + step.z)) yawObject.position.z += step.z;

                yawObject.position.y += velocity.y * delta;
                if (yawObject.position.y < 1.7) {
                    velocity.y = 0; yawObject.position.y = 1.7; canJump = true;
                }

                // 寶石自轉與拾取判定
                badges.forEach((b) => {
                    if (!b.collected) {
                        b.mesh.rotation.y += 2 * delta;
                        if (yawObject.position.distanceTo(b.mesh.position) < 2.2) {
                            b.collected = true;
                            scene.remove(b.mesh);
                            collectedCount++;
                            document.getElementById('collected-text').innerText = collectedCount;
                            playChime();
                            if (collectedCount === badges.length) {
                                document.getElementById('victory-card').style.display = 'block';
                                document.exitPointerLock();
                            }
                        }
                    }
                });

                drawMinimap();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
